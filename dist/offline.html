/* Beginner reading layer: one question, a concrete example, then source. */
.zero-layout,.source-lesson{max-width:880px;margin-inline:auto}

  <dialog id="search-dialog" aria-labelledby="search-title"><div class="search-top"><h2 id="search-title">搜索知识、章节和源码</h2><button id="close-search" aria-label="关闭搜索">×</button></div><label class="sr-only" for="global-search">关键词</label><input id="global-search" type="search" placeholder="试试 context、toolexec、重复 Span…" autocomplete="off"><div id="search-results" aria-live="polite"></div></dialog>
  <div id="toast" role="status"></div>
  <noscript>此指南需要 JavaScript 显示章节和交互图解。你可以下载源码，在本地运行，或阅读随附的 Markdown 手册。</noscript>
  <script type="module">const upstream = 'https://github.com/alibaba/loongsuite-go/tree/cac400935add57d8219122ba32857b8f55ac6eb1';
const docs = `${upstream}/docs`;

const q = (question, options, answer, explanation) => ({ q: question, options, answer, explanation });
const sec = (title, paragraphs, code, language, note) => ({ title, paragraphs, ...(code ? { code, language } : {}), ...(note ? { note } : {}) });
const walk = (file, symbol, task, url = `${upstream}/${file}`) => ({ file, symbol, task, url });

const chapters = [
  {
    id: 'orientation', title: '从一个普通 Go 函数开始：为什么需要插桩', subtitle: '先会跑一个小程序，再逐步理解 package、module、构建和观测', stage: '基础', minutes: 55, prerequisites: ['会读最基本的 Go 函数：func、参数、返回值和调用'],
    bridge: { known: '你会读并调用普通 Go 函数。', problem: '函数只给结果，调用过程、耗时和错误不容易看见。', idea: '先手动记录，再理解编译期工具如何按规则自动加记录点。', terms: [{ term: 'package', meaning: '一起编译的一组 Go 文件' }, { term: 'module', meaning: '有名字、可被依赖的一组 package' }, { term: 'binary', meaning: '编译后可直接运行的程序' }], takeaway: '先看懂源代码怎样变成程序，才知道插桩插在哪里。' },
    outcomes: ['能从一个普通函数读懂 package、import 和 module 的基本关系', '能用 go build 生成并运行一个二进制文件', '能说出“观察函数执行”为什么需要在代码中增加记录点，并理解自动插桩要解决的重复劳动'],
    sections: [
      sec('先看懂一个普通函数', ['先把“观测”放一边。下面的函数接收一个数字，返回一个数字；调用者只能看到返回值，不知道函数何时开始、用了多久、走了哪条分支。', '示意（可运行）：'], `package main\n\nimport "fmt"\n\nfunc addOne(n int) int { return n + 1 }\n\nfunc main() { fmt.Println(addOne(2)) }`, 'go', '保存为 main.go 后可运行：go run main.go；输出 3。'),
      sec('从 package 和 import 到 module', ['package 是一组一起编译的 Go 文件；import 表示“我要使用另一个 package”；module 是一组有名字、可被依赖的 package，module 名称和外部依赖的版本要求写在 go.mod 里。先只记住关系：文件属于 package，package 属于 module。', '创建练习模块：mkdir hello-observe && cd hello-observe && go mod init example.com/hello-observe；把上一个 main.go 放进去后运行 go run .。'], null, null, 'example.com/hello-observe 只是练习名称，不是线上地址。'),
      sec('go build 做了什么，输出在哪里', ['go run 会编译后临时运行；go build 会编译并留下可执行文件。-o 明确指定输出文件，便于你看到“源代码如何变成程序”。'], `go build -o hello .\n./hello`, 'sh', 'macOS/Linux 执行 ./hello；Windows 建议用 go build -o hello.exe .，再执行 .\\hello.exe。'),
      sec('为什么要观察函数执行', ['如果只看 addOne 的返回值，我们不知道它是否被调用、调用了几次、耗时多久或返回了什么错误。最直接的办法是在函数前后手动写记录：开始时记时间，结束时打印结果。', '这能解决一个函数的问题，却会让很多库调用都重复写同样的代码；而且提前 return、错误和并发都容易漏记。自动插桩的动机，就是在编译时把类似的记录点按规则加进去，仍交给普通 Go 编译器检查。'], `func addOne(n int) int {\n    fmt.Println("addOne: start")\n    result := n + 1\n    fmt.Println("addOne: end", result)\n    return result\n}`, 'go'),
      sec('从手动记录走到 LoongSuite', ['LoongSuite Go 的固定上游版本是 v1.15.0，commit 为 cac400935add57d8219122ba32857b8f55ac6eb1。它不是运行时凭空扫描已经编译好的程序，而是在 otel go build 过程中准备依赖、匹配规则、改写目标源码，再交给 Go 编译器生成二进制。', '先记住因果链：函数本身没有观察记录 → 手动加记录点 → 重复劳动变多 → 编译期工具按明确规则自动加点。'], `源代码 -> go build ->（规则命中时改写）-> Go 编译器 -> 二进制 -> 运行时产生记录`, 'text')
    ],
    walkthrough: [walk('README.md', 'Getting Started', '确认 otel go build 是编译期入口，并记录 Go 版本要求'), walk('docs/user/compilation-time.md', 'Compilation Time', '理解 preprocess、instrument、原始编译的时间组成'), walk('go.mod', 'module github.com/alibaba/loongsuite-go', '区分根模块、pkg 模块和测试依赖')],
    lab: { title: '运行一个普通函数，再手动加观察', steps: ['下载并解压实验包，进入 labs/00-start；先读 main.go 的 addOne。', '运行 go run .，比较 plain result 与 observed result，找出额外的 start/end 记录。', '用 go build 留下可执行文件，再直接运行它；观察结果相同。'], command: 'cd labs/00-start\ngo run .\nmkdir -p .bin\ngo build -o .bin/observe .\n.bin/observe', expected: '两个结果都是 3；带观察的路径额外打印 observe: start 和 observe: end，耗时可能每次不同。这里只手写普通 Go 记录，没有 OTel Span。', challenge: '把 main 中两处输入都改成 8，确认普通结果、观察结果和记录中的结果都是 9。' },
    quiz: [q('只运行 go build 后，下面哪项最能说明“已经得到一个可运行程序”？', ['目录中出现二进制文件，并执行它看到预期输出', '只看终端没有报错，不检查输出文件', '只查看 go.mod，不运行程序'], 0, 'go build 的直接结果是可执行文件；运行它才能验证输出。'), q('为什么一个函数的手动开始/结束打印会推动自动插桩？', ['因为每个函数都必须改名', '因为大量函数都重复需要相同记录，手写容易漏掉分支和错误', '因为 go.mod 会自动记录函数耗时'], 1, '自动插桩解决的是重复且易漏的记录劳动；module 文件不负责运行时观测。')],
    checkpoint: ['能运行一个含 main 函数的最小 Go 程序', '能说明 package、import、module 和 go build 的关系', '能用一句话解释“手动记录点”如何引出自动插桩'], sources: [{ title: 'LoongSuite Go README', url: 'https://github.com/alibaba/loongsuite-go/tree/cac400935add57d8219122ba32857b8f55ac6eb1' }, { title: 'Compilation Time', url: `${docs}/user/compilation-time.md` }], visual: 'pipeline'
  },
  {
    id: 'go-foundations', title: 'Go 最小阅读底座：从函数到可观察函数', subtitle: '先掌握普通 Go 的调用、错误、包和模块，再看工具如何改写它', stage: '基础', minutes: 75, prerequisites: ['orientation'],
    bridge: { known: '你已经能运行小程序并理解 module 的位置。', problem: '读 hook 时会遇到多返回值、接口、defer 和 context。', idea: '补齐这些普通 Go 机制，再把工具接口和标准库接口分开。', terms: [{ term: 'error', meaning: '作为返回值交给调用者处理的错误信息' }, { term: 'defer', meaning: '函数返回前执行的一次收尾调用' }, { term: 'interface', meaning: '只规定需要哪些方法的类型' }, { term: 'context.Context', meaning: '显式传递取消、期限和值的标准库接口' }], takeaway: '先会读普通 Go 的调用约定，才能判断生成 hook 是否正确。' },
    outcomes: ['能读函数、package、import、module、指针和 interface 的最小例子', '能用 defer 覆盖函数结束，并正确处理多返回值和 error', '能解释 context.Context 为什么要显式传递，并知道 CallContext 是工具接口而非 context.Context'],
    sections: [
      sec('函数的输入、输出和错误', ['Go 函数可以有多个返回值，最常见的约定是“结果 + error”。error 是一个值，不是自动抛出的异常；调用者要检查它。'], `package main\n\nimport "fmt"\n\nfunc divide(a, b int) (int, error) {\n    if b == 0 { return 0, fmt.Errorf("divide by zero") }\n    return a / b, nil\n}\n\nfunc main() {\n    result, err := divide(6, 2)\n    if err != nil {\n        fmt.Println("failed:", err)\n        return\n    }\n    fmt.Println(result)\n}`, 'go', '完整小程序；可单独保存为 main.go 后用 go run main.go 运行。'),
      sec('defer：无论从哪里 return，都做收尾', ['defer 会把一个调用安排到当前函数即将返回时执行。它适合关闭文件、结束计时或结束一个观测记录；进程被强制终止时不会执行。'], `func work() (result int) {\n    start := time.Now()\n    defer func() { fmt.Println("elapsed:", time.Since(start)) }()\n    return 42\n}`, 'go', '函数阅读片段；放入含 fmt、time 导入的完整程序，并在 main 中调用 work 才能运行。'),
      sec('package、import、module 的阅读顺序', ['读陌生 Go 目录时，先看每个 .go 文件的 package 行，再看 import，最后看最近的 go.mod。go.mod 中的 module 行是本模块名字，require 行表示依赖；replace 是“本地或指定位置替代某个依赖”的构建指示，不是 Go 语言语法。'], `module example.com/app\ngo 1.25\nrequire example.com/lib v1.2.3\nreplace example.com/lib => ../lib`, 'go.mod', '这是结构示意，不代表本课程上游 go.mod 的完整内容。'),
      sec('interface、指针和工具自己的 CallContext', ['interface 可以理解为“只声明我需要哪些方法”。如果方法写在 *T（指针类型）上，通常是 *T 满足接口，而 T 不一定满足；编译器会在赋值时检查。'], `type Greeter interface { Greet() string }\ntype User struct { Name string }\nfunc (u *User) Greet() string { return "hi " + u.Name }\nvar g Greeter = &User{Name: "Go"}`, 'go'),
      sec('context.Context 要显式传，CallContext 不是它', ['context.Context 是标准库接口，用来传取消信号、deadline 和请求范围的值；Go 不会因 go f() 自动复制它。需要把 ctx 作为参数传给子函数或任务。', 'LoongSuite 的 CallContext 是插桩 hook 用来读写目标函数参数、返回值和共享数据的工具接口；它不等于 context.Context，也不能替代 context 的取消或传播。GLS 同样是工具/runtime 的额外机制，不是 Go 原生自动 context。'], `func child(ctx context.Context) { fmt.Println(ctx.Value("request")) }\nctx := context.WithValue(context.Background(), "request", "demo")\nchild(ctx)`, 'go')
    ],
    walkthrough: [walk('pkg/api/api.go', 'CallContext', '阅读 hook 与被拦截函数之间的数据契约'), walk('pkg/api/impl.go', 'CallContextImpl（测试用）', '用简化实现理解字段存取；真实生成实现继续看 tool/instrument/impl.tmpl'), walk('docs/user/context-propagation.md', 'Context Propagation', '比较原生 context 与 GLS 补救机制')],
    lab: { title: '亲眼比较传 ctx 和重新开始', steps: ['进入 labs/01-context，找到 request 中保存的字符串 trace-request；这只是教学标识。', '比较把 request 显式交给新协程，与使用 context.Background() 的两条路径。', '找到预先启动的 worker：任务通过 jobs channel 传入 context，检查它拿到的是哪一份。'], command: 'cd labs/01-context\ngo run .', expected: '顺序可能变化，但共有两行 trace-request 和一行 <root>；Background 没有教学标识。此实验不创建 OTel Span，真实 Span 在第 05 章的 labs/05-otel 验证。', challenge: '把 jobs <- request 改成 jobs <- context.Background()，先预测输出，再运行；完成后恢复。' },
    quiz: [q('阅读一个接收 context.Context 的 hook 时，哪种调用最能保持父链？', ['把当前 ctx 作为参数传入并在子操作中继续使用', '在子操作开始时用 context.Background()，再把 TraceID 写入日志', '把 ctx 存到全局变量，供所有 goroutine 读取'], 0, '显式传递保留取消、deadline 和 SpanContext；Background 会丢父链，全局变量又会造成并发串链和生命周期问题。'), q('某类型只有指针 receiver 的方法，为什么值 T 作为接口参数可能编译失败？', ['接口方法集只收集导出方法，指针 receiver 不会自动属于 T 的方法集', '编译器会为所有值自动复制一份指针方法，因此不会失败', '方法集只影响运行时反射，不影响接口赋值'], 0, '指针和值的方法集不同，接口赋值在编译期检查；第二项混淆了自动取址场景，第三项错误地把静态类型检查归为反射。')],
    checkpoint: ['能解释 context.Context 的取消、deadline、值和显式传递', '能定位一个多返回值函数哪个返回值是 error', '能说出 CallContext 与 context.Context 的用途不同'], sources: [{ title: 'Go Context blog', url: 'https://go.dev/blog/context' }, { title: 'Effective Go', url: 'https://go.dev/doc/effective_go' }], visual: 'context'
  },
  {
    id: 'build', title: '从 otel go build 到目标二进制', subtitle: '理解 -toolexec、缓存和为什么编译时间会增加', stage: '机制', minutes: 60, prerequisites: ['go-foundations'],
    bridge: { known: '你知道 go build 会生成二进制。', problem: '普通构建不会自动进入 LoongSuite 的预处理和改写阶段。', idea: '用 otel go build 包住构建，并观察 -toolexec 如何接入 compiler。', terms: [{ term: 'toolchain', meaning: '编译器、链接器等构建工具链' }, { term: '-toolexec', meaning: '让 go 命令调用一个工具包装器' }, { term: 'cache', meaning: '可复用的构建结果' }], takeaway: '插桩先进入构建链，才有机会改变编译输入。' },
    outcomes: ['能解释 go build 的 toolchain 调用层级', '能找到预处理与 instrument 阶段的日志', '能区分 Go 缓存命中与插桩缓存策略'],
    sections: [
      sec('go build 的真实入口', ['普通 go build 会解析 go.mod、构建依赖包并调用编译器和链接器。LoongSuite 的 otel 命令包住这次构建，通过 Go 的 -toolexec 或等效工具链钩子拦截编译动作，识别哪些 package 应被改写，再把结果交给原始 compiler。', '阅读入口时先找命令参数解析和子进程执行，而不是先看某个 Redis hook。你要能回答“这个 package 何时被发现、源码何时被解析、失败如何返回给 go build”。']),
      sec('预处理与 instrument', ['预处理阶段通常准备依赖、生成配置或注入基础支持代码；instrument 阶段读取目标包、匹配规则、修改 AST/DST 并写入临时源码或编译输入。最终仍需让 go compiler 检查类型，所以插桩失败通常表现为编译失败。', '文档明确说明自动插桩在原始编译前增加 Preprocessing 和 Instrument 两个阶段。用日志时间戳拆分这三段，才能判断是网络拉依赖慢、AST 改写慢，还是 Go 本身慢。']),
      sec('为什么缓存不能简单照搬', ['Go build cache 以输入文件、编译参数、工具版本等为依据。插桩会改变源码、增加依赖和标准库支持文件；如果工具没有把规则版本和 probe 内容纳入缓存键，就可能复用错误产物。因此上游文档曾选择更保守的全量重编译。', '优化缓存的正确问题不是“能不能复用旧 .a”，而是“规则、probe、SDK、Go 版本和目标源码都相同时能否证明产物等价”。在 CI 中保留模块下载缓存和 Go build cache 可以缩短依赖准备，但不能掩盖插桩输入变化。']),
      sec('动手读日志', ['用一个小模块执行 go build -x 或 -work，保存命令；再执行 otel go build，比较 compiler 参数、临时目录和生成文件。不要把缓存目录提交到业务仓库。', '每次实验记录 GOTOOLCHAIN、GOOS、GOARCH、工具版本、规则快照和输出 hash。这样你才能复现“昨天通过、今天失败”的构建。'], `go env GOMOD GOTOOLCHAIN GOOS GOARCH GOCACHE GOPATH\ngo build -x -work ./...\notel go build -x -work ./...`, 'sh')
    ],
    walkthrough: [walk('tool/otel/main.go', 'main', '定位 otel 命令的入口和参数转发'), walk('docs/user/compilation-time.md', 'Compilation Time', '将文档的时间模型映射到日志'), walk('pkg/otel_setup.go', 'initOpenTelemetry', '看注入侧 SDK 依赖与版本固定说明')],
    lab: { title: '做一次编译对照', steps: ['用同一个 demo 分别运行普通 go build 和 -toolexec 包装器。', '把命令输出按 compile、link 分类。', '删除只属于本地工具的临时输出后比较二进制 hash。'], command: 'cd labs/03-toolexec && mkdir -p .bin && go build -o .bin/toolexec ./wrapper && TOOLEXEC_LOG=$PWD/toolexec.log go build -toolexec=$PWD/.bin/toolexec -o .bin/app . && .bin/app && grep -E "compile|link" toolexec.log', expected: '实验输出包含 compile、link 调用；这只验证 toolexec 边界，不等同于完整 LoongSuite 插桩。', challenge: '提出一个安全缓存键，至少包含 Go 版本、工具 commit、规则 hash、probe hash、go.mod 和目标源码 hash。' },

      sec('Start 的父子规则', ['Tracer.Start(ctx,name) 会从 ctx 读取当前 SpanContext。ctx 有有效本地 Span，就创建 child；没有就创建 root。context.WithoutCancel(ctx) 只移除取消与 deadline 传播，不等于创建新 Trace，也不应被误解成“脱离父 Span”。', '手动埋点和自动 hook 只要使用同一个 ctx 和 TracerProvider，就能形成一棵树。若 hook 使用 Background 或 GLS 取到另一份上下文，就会出现并列根 Span。']),
      sec('采样不是查询失败的同义词', ['ParentBased sampler 会优先尊重远程父节点的 sampled flag，再决定子 Span 是否 RecordAndSample。网关采样、collector tail sampling、存储延迟都可能让日志存在而 Trace 查询暂时为空。', '验证时记录请求时间、tenant、等待时间和查询接口；第一次 404 不足以证明丢数据。对比 TraceID、SpanID、parent references 和 process serviceName，而不是只看页面颜色。']),
      sec('属性、事件和状态', ['Span name 表示操作类型；attributes 用于可聚合维度；events 记录时间点；status 表示错误语义。把完整请求体、token 或高基数字段塞进 attributes 会造成隐私和成本风险。自动插桩的错误判断必须和业务语义分开。']),

    sections: [
      sec('进程内与进程间是两件事', ['进程内的 context 是 Go 值，函数可以显式传递；进程间不能直接发送 context，只能用 propagator 把 SpanContext 编码进 HTTP header、gRPC metadata 或消息 properties。消费者必须从 carrier Extract 后再 Start。', '一个服务全部接入 OTel 也不会自动修复消息字段为空；发送端没有 Inject，消费端只能创建新根。这个区别是理解“全链路”最重要的边界。']),
      sec('W3C 与 B3', ['W3C 用 traceparent 单头携带 version、TraceID、parent-id 和 flags；B3 多头拆成 X-B3-TraceId、X-B3-SpanId、X-B3-Sampled，B3 单头把它们组合在 b3。它们表达相似信息，但不能把两个不同父节点同时当成真相。', 'Composite propagator 的顺序会影响冲突输入。旧版 tracing 的 OTLP 初始化顺序是 TraceContext、Baggage、B3MultipleHeader；B3 extractor 本身会优先有效 b3 单头，再回退多头。网关应统一清理和重注入，而不是让下游猜。']),
      sec('GLS 与 goroutine', ['LoongSuite 文档描述了 GLS：创建 Span 时保存数据，新 goroutine 创建时复制对应结构，后续 Start 可从 GLS 读取最近 Span。这是编译期插入和 runtime hook 的联合能力，不是 Go 规范。', '它对普通、工具可识别的 go 语句可能有效；预先创建的 worker 只是在任务提交时执行，创建 worker 的时刻并没有当前请求。正确做法仍是提交 Job 时携带 ctx 或 carrier，worker 执行时恢复它。']),

      sec('修改参数和返回值', ['CallContext.SetParam 可以在调用原始函数前替换参数，SetReturnVal 可以在退出时替换返回值。固定版本对泛型目标不支持这两种修改，生成 setter 会 panic。修改前先判断函数是否真的允许改变语义；观测型 hook 应优先只读，避免把 tracing bug 变成业务 bug。', '多返回值尤其要小心：error 可能是 nil interface、typed nil 或包装错误。SetReturnVal 的索引错一位，编译器未必能替你发现。']),

const stages=[

['工具代理','-toolexec','标准 go build 启动 compiler 等工具时，经 otel 的内部代理处理。代理识别编译动作，非插桩操作继续转发。','runBuildWithToolexec → go build -toolexec=…'],
['结构改写','AST / DST','找到命中的函数声明，将进入与退出跳转点写进编译输入。解析的是程序结构，不是全项目搜索替换字符串。','RuleProcessor.instrument → apply_func.go'],
['标准编译','compile / link','生成代码仍要满足 Go 类型检查与符号链接契约；hook 签名或 linkname 目标错误会暴露在这一层。','Go compiler → object files → linker'],
['运行时','hook → SDK','函数执行时，hook 用 CallContext 和 context 读参数、创建或结束 Span；SDK 决定记录、批处理与导出。','OnEnter → original function → OnExit'],
['观察结果','Trace / log','检查的不只是 TraceID：还包括 Span 数、scope、kind、父节点、采样和上报。页面模型不会执行你的 Go 代码。','SpanContext ≠ recorded Span ≠ exported Trace']];
function pipeline(){return frame('一次构建，两个时间维度',`<div data-v="pipeline"><div class="visual-controls"><button class="visual-btn" data-step="-1" aria-label="上一步">←</button><button class="visual-btn" data-step="1" aria-label="下一步">下一步 →</button><label>阶段 <input type="range" min="0" max="6" value="0" aria-label="编译流程阶段"></label><span class="mono" data-stage-count>01 / 07</span></div><div class="flow">${stages.map((s,i)=>`<button class="flow-node ${i===0?'active':''}" data-phase="${i}">${s[0]}<small>${s[1]}</small></button>${i<6?'<span class="flow-arrow" aria-hidden="true">→</span>':''}`).join('')}</div><div class="diagram-output" aria-live="polite"></div><p class="diagram-caption">点选任一节点。前五步发生在构建期；后两步需要实际运行二进制。节点为学习分层，不代表真实函数调用次数。</p></div>`);}
function context(){return frame('同一任务，父上下文从哪里来？',`<div data-v="context"><div class="visual-controls"><label>执行方式 <select data-mode><option value="direct">普通函数调用</option><option value="goroutine">新 goroutine</option><option value="worker">预先启动的 worker</option><option value="message">跨进程消息</option></select></label><label><input type="checkbox" data-pass checked>显式交接 context / carrier</label><label><input type="checkbox" data-auto>启用插桩继承模型</label></div><div class="trace-tree" aria-live="polite"></div><div class="diagram-output"></div><p class="diagram-caption">ID 为教学符号。新 goroutine 的 GLS 继承仅表示本课程版本的适用场景，不是 Go 原生保证；本模型不模拟 worker/message 的自动交接适配；具体库规则可能另有支持。跨消息模型假设双方配置相同传播器。</p></div>`);}
function propagation(){return frame('把 Trace ID 和父 Span ID 分开观察',`<div data-v="propagation"><div class="visual-controls"><label>输入格式 <select data-format><option value="multi">只有 B3 多头</option><option value="w3c">只有 W3C</option><option value="single">只有 B3 单头</option></select></label><label><input type="checkbox" data-w3c>网关启用 W3C 提取</label><label><input type="checkbox" data-normalize>统一更新转发头</label></div><div class="two-columns"><div><small class="figure-label">真实请求经过的路径</small><div class="trace-tree">上游 A\n  └─ 网关入口 B\n       └─ 网关出站 C\n            └─ 应用 D</div></div><div><small class="figure-label">后端可能展示的 Span 树</small><div class="trace-tree" data-tree aria-live="polite"></div></div></div><div class="diagram-output"></div><p class="diagram-caption">此模型复现案例中的优先级，不替所有网关实现作结论。“单头残留”需出站请求头证据；仅凭树形图能证明父节点错误，不能证明头的具体改写机制。</p></div>`);}
function rule(){return frame('先判断能否命中，再讨论能否兼容',`<div data-v="rule"><div class="visual-controls"><label>目标库版本 <input type="text" data-version value="1.25.12" inputmode="decimal" aria-label="目标库版本"></label><label>规则范围 <select data-range><option value="1.25.10">[1.22.0, 1.25.10)</option><option value="1.26.0">[1.22.0, 1.26.0)</option></select></label><label><input type="checkbox" data-signature>已用新版本验证签名和行为</label></div><div class="flow"><div class="flow-node">ImportPath<small>示例：gorm.io/gorm</small></div><span class="flow-arrow">→</span><div class="flow-node" data-version-node>版本条件</div><span class="flow-arrow">→</span><div class="flow-node">Function / receiver<small>结构匹配</small></div><span class="flow-arrow">→</span><div class="flow-node" data-compatible>兼容证明</div></div><div class="diagram-output" aria-live="polite"></div><p class="diagram-caption">教学匹配器只处理三段数字稳定版本，未模拟全部 semver、依赖条件和上游函数正则细节。区间右侧 “)” 表示不包含上界；扩大范围不是兼容证明。</p></div>`);}
function hook(){return frame('CallContext 改参数，究竟会发生什么？',`<div data-v="hook"><div class="visual-controls"><label>原始参数 <input type="number" value="2" data-input min="-100" max="100"></label><label><input type="checkbox" data-mutate>OnEnter 用 SetParam 改为 5</label><label><input type="checkbox" data-return>OnExit 用 SetReturnVal 改为 99</label></div><div class="flow"><div class="flow-node">caller<small data-caller>x = 2</small></div><span class="flow-arrow">→</span><div class="flow-node active">OnEnter<small data-enter>只读</small></div><span class="flow-arrow">→</span><div class="flow-node">原函数<small data-raw>double(x)</small></div><span class="flow-arrow">→</span><div class="flow-node active">OnExit<small data-exit>只读</small></div></div><div class="diagram-output" aria-live="polite"></div><p class="diagram-caption">这是正常返回路径的简化模型，不是上游生成代码逐字复刻。参数/返回值修改只用于学习实验；真实可观测探针应先保持业务语义。</p></div>`);}
function sampling(){return frame('有 Trace ID，为什么不一定查到 Trace？',`<div data-v="sampling"><div class="visual-controls"><label><input type="checkbox" data-parent checked>上游 sampled=1</label><label><input type="checkbox" data-export checked>exporter 与网络正常</label><label><input type="checkbox" data-tail checked>Collector 保留</label><label><input type="checkbox" data-query checked>租户 / 时间 / 入库正确</label></div><div class="flow"><div class="flow-node">SpanContext<small>TraceID = T</small></div><span class="flow-arrow">→</span><div class="flow-node" data-record>SDK 记录</div><span class="flow-arrow">→</span><div class="flow-node" data-send>导出 + 保留</div><span class="flow-arrow">→</span><div class="flow-node" data-find>查询可见</div></div><div class="diagram-output" aria-live="polite"></div><p class="diagram-caption">以已有远程父上下文、默认 ParentBased 子采样为例；实际 sampler/processor 可改变结果。开关表达因果条件，不是实时监控指标。</p></div>`);}
function coverage(){return frame('同一条 Trace 中，哪些 Span 应该存在？',`<div data-v="coverage"><div class="visual-controls"><label><input type="checkbox" data-existing checked>现有入口和 otelhttp 已启用</label><label><input type="checkbox" data-auto checked>自动探针启用</label><label><input type="checkbox" data-dedup checked>精确去重已验证</label></div><div class="trace-tree" aria-live="polite"></div><div class="diagram-output"></div><p class="diagram-caption">示意图把重复现象简化为相似节点；真实判断还需结合调用语义、scope、kind 与包裹关系。同一 TraceID 下的不同操作 Span 应保留。</p></div>`);}
function renderVisual(kind){return ({pipeline,context,propagation,rule,hook,coverage,sampling,source:pipeline}[kind]||pipeline)();}

 case 'rule':{const val=$('[data-version]').value.trim(),parts=val.split('.'),valid=parts.length===3&&parts.every(x=>/^\d+$/.test(x));const cmp=(a,b)=>{for(let i=0;i<3;i++){if(+a[i]!==+b[i])return +a[i]-+b[i];}return 0;};const hit=valid&&cmp(parts,[1,22,0])>=0&&cmp(parts,$('[data-range]').value.split('.'))<0,proof=checked('[data-signature]');$('[data-version-node]').classList.toggle('active',hit);$('[data-compatible]').classList.toggle('active',hit&&proof);$('.diagram-output').textContent=!valid?'请输入三段数字版本，例如 1.25.12。':!hit?'版本不命中：这一条规则不会因扩大函数名正则而自动支持该版本。':!proof?'版本已命中，但兼容性仍未知。先核对 receiver、参数/返回值、私有字段和运行语义，再跑新旧版本 fixture。':'版本条件和“已验证”开关都满足。这只是学习状态：真实发布必须保存编译、运行与回归证据。';break;}

function bindDependencyExercise(element) {
  const exercise=element.querySelector('[data-dependency-exercise]');
  if(!exercise)return ()=>{};
  let built=false;
  const run=exercise.querySelector('[data-dependency-action="run"]'),feedback=exercise.querySelector('[data-dependency-feedback]'),output=exercise.querySelector('[data-dependency-output]');
  const reset=()=>{built=false;run.hidden=true;output.hidden=true;feedback.textContent='配置已改变。重新检查这次构建是否具备所需代码。';};
  const click=event=>{

    if(action==='build'){
      const result=dependencyExerciseResult(exercise.querySelector('[data-dependency-require]').checked,exercise.querySelector('[data-dependency-replace]').checked);
      built=result.ready;run.hidden=!built;output.hidden=true;feedback.textContent=result.message;

  };
  exercise.addEventListener('change',reset);exercise.addEventListener('click',click);
  return ()=>{exercise.removeEventListener('change',reset);exercise.removeEventListener('click',click);};
}

// Choose the paragraph at the reading line, using all positions in either direction.
function storyFrameAtReadingLine(tops,readingTop) {
  let index=0;
  for(let i=1;i<tops.length;i++){
    if(tops[i]>readingTop)break;
    index=i;
  }
  return index;
}

function bindLessonDemos(root) {
  const cleanups=[];
  root.querySelectorAll('[data-lesson-demo]').forEach(element=>{
    const [kind,id]=element.dataset.lessonDemo.split(':'),demo=lessonDemos[kind]?.[id];if(!demo)return;
    let caseIndex=0,frameIndex=0,pendingFrame=0,disposed=false;
    let resizeObserver=null;
    const select=(index,replay=false)=>{
      if(!demo.cases[caseIndex].frames[index]||(!replay&&index===frameIndex))return;
      frameIndex=index;
      element.querySelector('[data-motion-scene]').innerHTML=renderMotionScene(kind,id,caseIndex,index);
      element.querySelector('[data-motion-caption]').textContent=getMotionMap(kind,id,caseIndex,index).current.note;
      element.querySelectorAll('[data-story-step]').forEach(node=>node.classList.toggle('current',Number(node.dataset.storyStep)===index));
      element.querySelectorAll('[data-story-select]').forEach(button=>{if(Number(button.dataset.storySelect)===index)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');});
    };
    const followScroll=()=>{
      pendingFrame=0;
      if(disposed)return;
      const picture=element.querySelector('.story-picture'),paragraphs=element.querySelector('.story-paragraphs');
      const pictureRect=picture.getBoundingClientRect(),paragraphRect=paragraphs.getBoundingClientRect();
      const stacked=Math.abs(pictureRect.left-paragraphRect.left)<15;
      const pictureStyle=getComputedStyle(picture);
      const stickyTop=parseFloat(pictureStyle.top)||0;
      const readingTop=Math.min(window.innerHeight-48,pictureStyle.position==='static'?110:stickyTop+(stacked?pictureRect.height:0)+24);
      const tops=Array.from(element.querySelectorAll('[data-story-step]'),node=>node.getBoundingClientRect().top);
      select(storyFrameAtReadingLine(tops,readingTop));
    };
    const scheduleFollowing=()=>{
      if(!disposed&&!pendingFrame)pendingFrame=requestAnimationFrame(followScroll);
    };
    const watchLayout=()=>{
      resizeObserver?.disconnect();
      if(typeof ResizeObserver!=='undefined'){
        resizeObserver=new ResizeObserver(scheduleFollowing);
        resizeObserver.observe(element);
        resizeObserver.observe(element.querySelector('.story-picture'));
      }
      scheduleFollowing();
    };
    const click=event=>{
      const button=event.target.closest('button');if(!button||!element.contains(button))return;
      if(button.dataset.storySelect!==undefined){
        // A click replays this scene; the next actual scroll resumes following.
        cancelAnimationFrame(pendingFrame);pendingFrame=0;
        select(Number(button.dataset.storySelect),true);
      }
      if(button.dataset.storyCase!==undefined){
        const index=Number(button.dataset.storyCase);if(!demo.cases[index])return;
        caseIndex=index;frameIndex=0;
        element.querySelector('[data-story-body]').innerHTML=storyBody(kind,id,demo,index);
        element.querySelectorAll('[data-story-case]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.storyCase)===index)));
        element.querySelectorAll('[data-story-answer]').forEach(input=>input.checked=false);
        element.querySelector('[data-story-feedback]').hidden=true;watchLayout();
      }
    };
    const change=event=>{
      if(!event.target.matches('[data-story-answer]'))return;
      const answer=Number(event.target.value),feedback=element.querySelector('[data-story-feedback]');
      feedback.hidden=false;feedback.textContent=`${answer===demo.question.answer?'✓ 判断正确。':'这里还差一步。'} ${demo.question.feedback?.[answer]||demo.question.explanation}`;
    };
    element.addEventListener('click',click);element.addEventListener('change',change);watchLayout();
    cleanups.push(bindDependencyExercise(element));
    window.addEventListener('scroll',scheduleFollowing,{passive:true});
    window.addEventListener('resize',scheduleFollowing);
    cleanups.push(()=>{
      disposed=true;cancelAnimationFrame(pendingFrame);resizeObserver?.disconnect();
      element.removeEventListener('click',click);element.removeEventListener('change',change);
      window.removeEventListener('scroll',scheduleFollowing);window.removeEventListener('resize',scheduleFollowing);
    });
  });
  return ()=>cleanups.forEach(clean=>clean());
}

const preprocessRealExample=`<aside class="source-real-example"><h3>源码里的同类情况：给 GORM 加观察代码，为什么会多出 MySQL 包？</h3><p>假设业务原来使用匹配版本的 GORM 和 PostgreSQL，没有引用 MySQL driver。第一次匹配会选中 GORM 的 <code>Open</code> 规则。这个规则指向的 <code>pkg/rules/gorm/setup.go</code> 自己却引用了 <code>gorm.io/driver/mysql</code>，并访问 <code>Config.DbInfo</code>。</p><p>把 GORM 记录包加入构建以后，MySQL driver 也进入构建范围；第二次匹配才能对它应用“给 Config 增加 DbInfo 字段”的规则。这解释了为什么加入规则代码后还要重新匹配。第三次准备按最终结果再生成、同步；本例不保证第三次一定增加新模块。</p><p>上面的动画用两个教学自定义规则，把“第二次匹配又选出一个带记录包的规则”的情形拆得更明显。实际依赖取决于你的项目；当前实现固定两次匹配，没有循环到完全不再变化的检查。</p><p>这是基于固定源码推导的路径，没有在本页执行该数据库组合。对应源码：<a href="https://github.com/alibaba/loongsuite-go/blob/cac400935add57d8219122ba32857b8f55ac6eb1/tool/data/rules/gorm.json" target="_blank" rel="noopener noreferrer">GORM 规则</a> · <a href="https://github.com/alibaba/loongsuite-go/blob/cac400935add57d8219122ba32857b8f55ac6eb1/pkg/rules/gorm/setup.go#L106" target="_blank" rel="noopener noreferrer">记录包读取 DbInfo</a> · <a href="https://github.com/alibaba/loongsuite-go/blob/cac400935add57d8219122ba32857b8f55ac6eb1/tool/preprocess/preprocess.go#L273" target="_blank" rel="noopener noreferrer">三轮的实际控制流</a></p></aside>`;

e)} · ${escape(next.title)} →</a>` : '<span></span>'}</nav></article></div>`;

{escape(s.title)}</a>`).join('')}${[['source-reading','源码阅读'],['lab','动手练习'],['quiz','检查理解'],['checkpoint','能力检查'],['notes','我的笔记']].map(([id,t])=>`<a href="#${id}" data-scroll="${id}">${t}</a>`).join('')}<div class="toc-tools"><a href="./assets/labs.zip" download>下载实验包 ↓</a><a href="./offline.html" download>离线手册 ↓</a></div></aside></div>`;}
function sourcePage(selected=sourceMap[0]?.id){const s=sourceMap.find(x=>x.id===selected)||sourceMap[0];return renderSourcePage(s,sourceLessons[s.id],sourceMap,{inline,escape,codeBlock});}
function labsPage(){return `<div class="eyebrow">THE WORKBENCH / 运行以后再下结论</div><h1>一次只改变一个变量。</h1><p>实验在本地 Go 环境运行，页面不会调用业务接口，也不冒充在线 Go IDE。下载后先读 README，再按实验顺序进行。</p><div class="toolbar"><a class="btn" href="./assets/labs.zip" download>下载实验源码 ↓</a><a class="btn light" href="./lab-results.json" download>下载执行记录 ↓</a></div><div class="callout"><b>验证口径：</b>标准库机制实验、自定义 hook 编译实验、OTel SDK 实验分别标记。某个实验通过，不代表真实业务环境所有路径已验收。工具与依赖需要网络时，下载发生在你的终端。</div><div class="callout"><b>第一次学习，从 00 开始：</b>先运行普通 Go 函数，再逐个进入后面的机制实验。<code>run-all.sh</code> 是完整检查脚本，适合完成学习后使用。</div>${codeBlock('unzip labs.zip\ncd labs/00-start\ngo run .','sh')}${labRegistry.map((l,i)=>`<section class="lab-entry" id="lab-${i+1}"><div class="eyebrow">LAB ${escape(l.id.split('-')[0])} <span class="lab-status">${escape(l.status)}</span></div><h2>${escape(l.title)}</h2><p>${inline(l.goal)}</p>${codeBlock(l.command,'sh')}<div class="two-columns"><section><h3>观察哪一个证据？</h3><p>${inline(l.expected)}</p></section><section><h3>再做一个改动</h3><p>${inline(l.challenge)}</p></section></div><details><summary>展开参考解释与排查方向</summary><p>${inline(l.answer)}</p>${l.output?codeBlock(l.output,'text'):''}</details></section>`).join('')}<section class="article-section"><h2>从实验走向自己的规则</h2><p>先让只读 hook 正常编译、执行并保留原返回值；再把 OTel Span 接进去。修改参数、返回值、runtime/GLS 都应建立独立回归，不能用一个成功截图替代。</p><a href="${chapterLink('capstone')}" class="btn">进入毕业项目 →</a></section>`;}
function resourcesPage(){return `<div class="eyebrow">WRITING THE GUIDE / 编写方法与模板</div><h1>好的指南，先设计学习。</h1><div class="toolbar"><a class="btn light" href="./guide-authoring-resources.md" download>下载资源对比 ↓</a><a class="btn light" href="./chapter-template.md" download>下载章节模板 ↓</a></div><p>这些资源承担不同工作：skill 帮助组织与审稿，方法决定学习体验，文档框架负责呈现。下面是针对这份 Go 源码课程的选择依据，核对日期为 2026-10-27。</p><div class="callout"><b>本次选择：</b>teach 的分阶反馈 + Diátaxis 的内容分工 + Google 的读者与示例方法 + doc-coauthoring 的读者检验思路。界面采用原生 HTML/CSS/JS，便于离线与自定义图解；没有为了套模板而引入 React/Vue。下列安装命令是可选参考，本次没有全局安装这些 skill 或框架。</div><div class="table-scroll"><table class="reference-table"><thead><tr><th>你需要什么</th><th>优先考虑</th><th>选择原因</th></tr></thead><tbody><tr><td>从零学会一套技术</td><td>Diátaxis + 可验证实验</td><td>先设计读者动作和成功反馈，再补解释。</td></tr><tr><td>让 AI 协助写长文</td><td>doc-coauthoring</td><td>先整理证据与读者目标，再做无上下文读者检查。</td></tr><tr><td>长期维护内容型文档</td><td>Starlight</td><td>现成文档导航、搜索与组件，维护成本相对集中。</td></tr><tr><td>在文中加入复杂互动</td><td>VitePress / Docusaurus</td><td>分别利用 Vue / React 组件；选择团队熟悉的生态。</td></tr><tr><td>短篇但深入的互动手册</td><td>原生网页 + 小组件</td><td>可离线、无需构建依赖，交互围绕学习问题设计。</td></tr></tbody></table></div>${resources.map(r=>`<section class="resource-item"><div><span class="tag">${escape(r.kind)}</span><h2 style="font-size:20px;margin:12px 0 6px">${escape(r.name)}</h2><a href="${escape(r.url)}" target="_blank" rel="noopener noreferrer">官方 / GitHub ↗</a></div><div><p><b>适合：</b>${inline(r.fit)}</p><p><b>局限：</b>${inline(r.limit)}</p><p><b>本指南的借鉴：</b>${inline(r.adopt)}</p><a href="${escape(r.docs)}" target="_blank" rel="noopener noreferrer">阅读原始说明 ↗</a>${r.install?codeBlock(r.install,'sh'):''}</div></section>`).join('')}<section class="article-section"><h2>一份可以复用的教学章节模板</h2><p>模板的关键是让每一步产出证据，而不是每章重复“概述、特点、总结”。复制后，用具体函数、版本和输出替换泛化内容。</p>${codeBlock(lessonTemplate,'markdown')}</section><section class="article-section"><h2>本手册的质量门槛</h2><ol><li>每个术语在第一次出现时解释，并能连回具体源码。</li><li>源码路径存在，链接固定到提交，阅读问题有明确目标。</li><li>可运行代码必须有命令、前置、预期和真实状态；示意代码清楚标注。</li><li>图解表达因果，不用装饰动画替代解释。</li><li>完成不等于读过：你能复现实验、修改输入，再解释差异。</li></ol></section>`;}
function glossaryPage(){return `<div class="eyebrow">THE GLOSSARY / 快速找回概念</div><h1>让每个名词都有落点。</h1><p>阅读源码时遇到陌生词，先确认它属于编译期、运行时，还是采集后端。不要把同一层的对象混作另一层的能力。</p><label class="sr-only" for="glossary-search">筛选术语</label><input class="filter-input" id="glossary-search" type="search" placeholder="搜索 AST、carrier、GLS…"><dl class="glossary">${glossary.map(([term,def])=>`<div data-term><dt>${escape(term)}</dt><dd>${inline(def)}</dd></div>`).join('')}</dl>`;}
function getRoute(){const raw=location.hash.slice(1)||'/';return raw.startsWith('/')?raw:'/';}
function render(){disposeLessonDemos();const route=getRoute(),[_,type,id]=route.split('/');currentRoute=route;let content,label;if(type==='learn'){const c=chapters.find(c=>c.id===id);if(!c){location.hash='/';return;}state.last=c.id;persist();content=chapterPage(c);label=`${number(c.id)} / ${c.title.split('：')[0]}`;}else if(type==='start'){content=renderZeroPage(id,{inline,escape,codeBlock});label='从零开始 · 七小步';}else if(type==='official'){content=renderOfficialPage(id,{inline,escape})
label='对照官方文档'
}else if(type==='source'){content=sourcePage(id);label='源码地图';}else if(type==='labs'){content=labsPage();label='动手实验';}else if(type==='resources'){content=resourcesPage();label='编写方法与资源';}else if(type==='glossary'){content=glossaryPage();label='术语速查';}else{content=overview();label='学习路线';}
 app.innerHTML=shell(route,content,label);document.title=`${label} · LoongSuite Go 学习手册`;bindVisual(app);disposeLessonDemos=bindLessonDemos(app);bindGeneral();if(type==='learn')bindChapter(chapters.find(c=>c.id===id));if(type==='source')bindSource();if(type==='glossary')$('#glossary-search').addEventListener('input',e=>app.querySelectorAll('[data-term]').forEach(n=>n.hidden=!n.textContent.toLowerCase().includes(e.target.value.toLowerCase())));window.scrollTo(0,0);
}
function bindGeneral(){app.querySelectorAll('[data-search]').forEach(b=>b.onclick=openSearch);app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.closest('.code-frame').querySelector('[data-raw]').textContent));app.querySelectorAll('[data-scroll]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.scroll)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});app.querySelectorAll('[data-export]').forEach(b=>b.onclick=exportNotes);app.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>window.print());app.querySelector('[data-menu]')?.addEventListener('click',()=>{const open=$('.sidebar').classList.toggle('open');$('.mobile-scrim').classList.toggle('open',open);$('[data-menu]').setAttribute('aria-expanded',String(open));});app.querySelector('[data-close-menu]')?.addEventListener('click',()=>{$('.sidebar').classList.remove('open');$('.mobile-scrim').classList.remove('open');$('[data-menu]').setAttribute('aria-expanded','false');});}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('已复制');}catch{const input=document.createElement('textarea');input.value=text;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();const ok=document.execCommand('copy');input.remove();toast(ok?'已复制':'请选中代码后复制');}}
function eligible(c){return c.quiz.every((q,i)=>state.answers[c.id]?.[i]===q.answer)&&c.checkpoint.every((_,i)=>(state.checks[c.id]||[]).includes(i));}
function updateCompletion(c){const ok=eligible(c),done=state.done.includes(c.id);$('[data-complete]').disabled=!ok&&!done;$('[data-completion-help]').textContent=done?'完成记录已保存在当前浏览器。':ok?'测验与能力检查已完成，可以进入下一章。':'答对本章测验，并确认全部能力检查后解锁。';}
function bindChapter(c){app.querySelectorAll('[data-quiz]').forEach(field=>field.addEventListener('change',e=>{const i=Number(field.dataset.quiz),j=Number(e.target.value);state.answers[c.id]||={};state.answers[c.id][i]=j;persist();const feedback=field.querySelector('.feedback');feedback.hidden=false;feedback.classList.toggle('incorrect',j!==c.quiz[i].answer);feedback.innerHTML=`${j===c.quiz[i].answer?'✓ 回答正确。':'再想一想。'} ${inline(c.quiz[i].explanation)}`;updateCompletion(c);}));app.querySelectorAll('[data-check]').forEach(input=>input.addEventListener('change',()=>{const i=Number(input.dataset.check),v=new Set(state.checks[c.id]||[]);input.checked?v.add(i):v.delete(i);state.checks[c.id]=[...v];persist();updateCompletion(c);}));$('[data-complete]').onclick=()=>{if(!eligible(c))return;if(!state.done.includes(c.id))state.done.push(c.id);persist();render();toast('已完成本章，学习进度已保存。');};$('#chapter-notes').addEventListener('input',e=>{state.notes[c.id]=e.target.value;persist();$('[data-note-status]').textContent='已保存';});updateCompletion(c);}
function bindSource(){app.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{location.hash=`/source/${b.dataset.source}`;});$('#source-filter')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();app.querySelectorAll('[data-source]').forEach(n=>{const s=sourceMap.find(s=>s.id===n.dataset.source);n.hidden=![s.title,s.path,s.symbol,s.role,sourceLessons[s.id]?.title,sourceLessons[s.id]?.plain].join(' ').toLowerCase().includes(q);});const empty=app.querySelector('.source-no-results');if(empty)empty.hidden=Array.from(app.querySelectorAll('[data-source]')).some(n=>!n.hidden);});}
const dialog=$('#search-dialog');function openSearch(){dialog.showModal();$('#global-search').value='';search('');$('#global-search').focus();}$('#close-search').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();dialog.open?dialog.close():openSearch();}});$('#global-search').addEventListener('input',e=>search(e.target.value));
function demoSearchText(kind,id){const d=lessonDemos[kind]?.[id];return d?[d.title,d.scenario,...d.cases.flatMap(c=>c.frames.flatMap(f=>[f.title,f.explain,f.code.text]))].join(' '):'';}
function search(q){const word=q.toLowerCase().trim();const hits=[];
 for(const [i,s]of zeroSteps.entries()){const text=[s.title,s.question,...s.paragraphs,...s.terms.map(t=>t.term+' '+t.meaning),demoSearchText('zero',s.id)].join(' ');if(!word||text.toLowerCase().includes(word))hits.push({title:`从零 ${i+1} · ${s.title}`,url:`#/start/${i+1}`,detail:s.question});}
 for(const c of chapters){const text=[c.title,c.subtitle,...c.sections.flatMap(s=>[s.title,...s.paragraphs]),...c.bridge.terms.map(t=>t.term+' '+t.meaning),demoSearchText('chapter',c.id)].join(' ');if(!word||text.toLowerCase().includes(word)){const at=text.toLowerCase().indexOf(word);hits.push({title:`${number(c.id)} · ${c.title}`,url:chapterLink(c.id),detail:word?text.slice(Math.max(0,at-25),at+100):c.subtitle});}}
 for(const s of sourceMap){const lesson=sourceLessons[s.id];if(word&&[s.title,s.path,s.symbol,s.role,lesson.title,lesson.plain,...lesson.terms.map(t=>t.term+' '+t.meaning),demoSearchText('source',s.id)].join(' ').toLowerCase().includes(word))hits.push({title:lesson.title,url:`#/source/${s.id}`,detail:s.path});}
 for(const p of officialPages)if(word&&[p.title,p.group.title,p.says,p.gap,p.question].join(' ').toLowerCase().includes(word))hits.push({title:`官方文档对照 · ${p.group.title} · ${p.title}`,url:`#/official/${p.id}`,detail:p.path})
 $('#search-results').innerHTML=hits.length?hits.slice(0,30).map(x=>`<a href="${x.url}">${escape(x.title)}<small>${escape(x.detail)}</small></a>`).join(''):'<p class="empty">没有匹配结果。试试 module、依赖、context、采样或 hook。</p>';$('#search-results').querySelectorAll('a').forEach(a=>a.onclick=()=>dialog.close());}
function exportNotes(){let text='# LoongSuite Go 学习记录\n\n源码版本：v1.15.0 / cac400935add57d8219122ba32857b8f55ac6eb1\n\n';for(const c of chapters){text+=`## ${number(c.id)} ${c.title}\n\n状态：${state.done.includes(c.id)?'已完成':'学习中 / 未完成'}\n\n${state.notes[c.id]||'（暂无笔记）'}\n\n`;for(const [i,item]of c.checkpoint.entries())text+=`- [${(state.checks[c.id]||[]).includes(i)?'x':' '}] ${item}\n`;text+='\n';}const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='loongsuite-learning-notes.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('学习笔记已导出');}
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();$('#main').focus();$('#main').scrollIntoView();});
window.addEventListener('hashchange',render);render();
</script>
